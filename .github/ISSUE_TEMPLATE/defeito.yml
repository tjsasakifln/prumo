name: Defeito reproduzível
description: Relatar problema e ligar à capacidade e versão afetadas.
title: "[Defeito] "
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema observado
      description: Inclua versão, disciplina, capacidade, resultado esperado e resultado obtido.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Use um caso mínimo autorizado, sem segredos ou dados de cliente sem permissão.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidências e impacto
      description: Para cálculo, informe unidade, método, snapshot e referência independente. Indique entregas e outras disciplinas potencialmente afetadas.
    validations:
      required: true
