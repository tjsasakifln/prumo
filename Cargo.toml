[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/tjsasakifln/prumo"

[workspace.dependencies]
prumo-domain = { path = "crates/prumo-domain" }
prumo-app = { path = "crates/prumo-app" }
prumo-ui = { path = "crates/prumo-ui" }
prumo-mcp = { path = "crates/prumo-mcp" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4", "serde", "js"] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
sha2 = "=0.11.1"
prumo-registry = { path = "crates/prumo-registry" }
prumo-components = { path = "crates/prumo-components" }
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
geo = { version = "=0.33.1", default-features = false }
ruststep = { version = "=0.4.0", default-features = false }
svg = "=0.18.0"
quick-xml = "=0.41.0"
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch", "stable", "extra-checks"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

