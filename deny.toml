# The shipped desktop targets and the reusable UI compile target.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = false

[advisories]
# These are informational merger/deprecation notices, not vulnerability waivers.
# PRU-003 rechecked the AccessKit chain and the new build-only macro dependency.
# Exact scope, evidence and removal conditions: docs/componentes/PRU-003.md.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "Rechecked PRU-003: AccessKit/AT-SPI requires zbus5.19; upstream AccessKit PR834 documents transition to zbus6. Maintenance only; remove after compatible upgrade, reassess each lock update and distribution." },
    { id = "RUSTSEC-2026-0371", reason = "Rechecked PRU-003: zbus_names4 remains in the AccessKit Linux chain pending zbus6. Maintenance only; remove after compatible upgrade, reassess each lock update and distribution." },
    { id = "RUSTSEC-2026-0372", reason = "Rechecked PRU-003: zvariant_derive5 remains in the AccessKit Linux chain pending zbus6. Maintenance only; remove after compatible upgrade, reassess each lock update and distribution." },
    { id = "RUSTSEC-2024-0370", reason = "PRU-003 bounded STEP experiment only: proc-macro-error1.0.4 is a ruststep-derive build dependency over pinned Rust sources, not project inputs. Maintenance advisory, no vulnerability described. Reassess every lock update; remove or requalify before project IFC import." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "epaint_default_fonts@0.37.0", allow = ["MIT", "Apache-2.0", "OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Prumo's unpublished code has not adopted an open source product license.
# This exemption does not cover external packages.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
